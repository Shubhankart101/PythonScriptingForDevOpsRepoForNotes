name: Update Daily PowerShell Project Use Cases

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-use-cases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh daily index
        shell: python
        run: |
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('projects/DAILY_USE_CASES.md')
          content = path.read_text(encoding='utf-8')
          marker = 'Generated by `.github/workflows/update-use-cases.yml` at 7:00 AM IST.'
          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          path.write_text(content.replace(marker, f'{marker} Last refreshed: {today}.'), encoding='utf-8')

      - name: Commit daily index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/DAILY_USE_CASES.md
          git diff --cached --quiet && exit 0
          git commit -m "Refresh daily PowerShell project use cases"
          git push
